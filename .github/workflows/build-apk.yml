name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore strategy source
        run: cat strategy.part1 strategy.part2 > app/src/main/java/com/hybridtrader/v36monitor/Strategy.kt
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM" || SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -111 | head -1)
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HybridV36SignalMonitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
